[project]
name = "gk2-save-editor"
dynamic = ["version"]
description = "Command-line save editor for Graveyard Keeper 2: items, money, talents, zombies, with automatic backups"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["graveyard-keeper-2", "save-editor", "odin-serializer", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = [
    "platformdirs>=4.12.0",
    "typer>=0.27.2",
    "UnityPy>=1.25.3",
]

[project.urls]
Homepage = "https://github.com/sextonworks/gk2-save-editor"
Issues = "https://github.com/sextonworks/gk2-save-editor/issues"
Releases = "https://github.com/sextonworks/gk2-save-editor/releases"

[project.scripts]
gk2 = "gk2.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.16.9",
    "ty==0.0.84",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "gk2/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["gk2"]

[tool.hatch.build.targets.sdist]
include = ["gk2", "tests", "docs", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N", "C4", "PT", "PTH", "RET"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "PLR0912", "PLR0915", "PLR0911", "PLW2901"]

[tool.ruff.lint.per-file-ignores]
"gk2/gamedata.py" = ["PLC0415"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["gk2", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
